name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────────
  # Code correctness
  # ──────────────────────────────────────────────────────────
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm 11 — same install path pi uses for this extension, so an
      # unapproved build script (ERR_PNPM_IGNORED_BUILDS) fails CI instead
      # of breaking `pi update` locally.
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check

  # ──────────────────────────────────────────────────────────
  # Code-level vulnerability scanning (SAST)
  # ──────────────────────────────────────────────────────────
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: +security-extended,security-and-quality
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  # ──────────────────────────────────────────────────────────
  # Custom static analysis — pi extension attack patterns
  # ──────────────────────────────────────────────────────────
  semgrep:
    name: Semgrep — pi extension audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep with custom rules
        run: |
          semgrep --config .semgrep/ --error --output semgrep-report.sarif --sarif .
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-report.sarif
          category: semgrep-pi-audit
        if: always()

  # ──────────────────────────────────────────────────────────
  # Hardcoded secrets detection
  # ──────────────────────────────────────────────────────────
  gitleaks:
    name: Gitleaks — secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "true"

  # ──────────────────────────────────────────────────────────
  # Dependency supply-chain security
  # ──────────────────────────────────────────────────────────
  deps-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Check if dependency graph is enabled
        run: |
          echo "Dependency review requires enabling Dependency graph in repo settings."
          echo "Go to: https://github.com/patlux/pi-commandcode-provider/settings/security_analysis"
          echo "Enable: Dependency graph"
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD
          comment-summary-in-pr: always
        continue-on-error: true

  deps-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=moderate
      - name: Exit gracefully on audit findings
        if: failure()
        run: |
          echo "::warning::pnpm audit found vulnerabilities. Review and patch before merging."

  # ──────────────────────────────────────────────────────────
  # Postinstall script check — prevents install-time malware
  # ──────────────────────────────────────────────────────────
  check-scripts:
    name: Check lifecycle scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for malicious lifecycle scripts
        run: |
          echo "::group::package.json scripts"
          node -e "
            const pkg = require('./package.json');
            const dangerous = ['preinstall','install','postinstall','prepublish','prepare'];
            const found = dangerous.filter(s => pkg.scripts && pkg.scripts[s]);
            if (found.length) {
              found.forEach(s => console.log('WARNING: package.json has "' + s + '":', pkg.scripts[s]));
              process.exit(1);
            } else {
              console.log('No dangerous lifecycle scripts in package.json');
            }
          "
          echo "::endgroup::"
          echo "::group::dependency scripts (top-level)"
          node -e "
            const fs = require('fs'), path = require('path');
            const dangerous = ['preinstall','install','postinstall','prepublish','prepare'];
            const hits = [];
            (function walk(dir) {
              if (!fs.existsSync(dir)) return;
              for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
                const p = path.join(dir, e.name);
                if (!e.isDirectory()) continue;
                if (e.name === 'node_modules') {
                  for (const e2 of fs.readdirSync(p, { withFileTypes: true })) {
                    const p2 = path.join(p, e2.name);
                    if (!e2.isDirectory()) continue;
                    const pkg = path.join(p2, 'package.json');
                    if (fs.existsSync(pkg)) {
                      try {
                        const j = JSON.parse(fs.readFileSync(pkg, 'utf8'));
                        const s = j.scripts || {};
                        const has = Object.keys(s).filter(k => dangerous.includes(k));
                        if (has.length) hits.push(j.name + '@' + j.version + ' scripts: ' + has.join(','));
                      } catch (_) {}
                    }
                    walk(p2);
                  }
                } else walk(p);
              }
            })('node_modules/.pnpm');
            if (hits.length) {
              hits.forEach(h => console.log('⚠', h));
            } else {
              console.log('No dependency lifecycle scripts');
            }
          "
          echo "::endgroup::"
